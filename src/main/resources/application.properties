spring.application.name=billing-platform
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=60000
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Project assistant credentials stay on the server.
assistant.openai-api-key=${OPENAI_API_KEY:}
assistant.model=${OPENAI_MODEL:gpt-5.4-mini-2026-03-17}
assistant.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}
assistant.requests-per-day=${AI_REQUESTS_PER_DAY:100}
assistant.requests-per-month=${AI_REQUESTS_PER_MONTH:500}
